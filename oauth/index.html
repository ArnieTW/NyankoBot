<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NyankoBot OAuth Handoff</title>
    <link rel="icon" type="image/png" href="../assets/ArnieTW_Mischevous.png">
    <style>
        :root {
            color-scheme: dark;
            --bg: #111827;
            --panel: #1f2937;
            --line: #374151;
            --text: #f3f4f6;
            --muted: #9ca3af;
            --accent: #ef4444;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
            background: var(--bg);
            color: var(--text);
            font-family: Inter, Segoe UI, Arial, sans-serif;
        }

        main {
            width: min(620px, 100%);
            padding: 24px;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: var(--panel);
        }

        h1 {
            margin: 0 0 10px;
            font-size: 28px;
            line-height: 1.1;
        }

        p {
            margin: 0;
            color: var(--muted);
            line-height: 1.5;
        }

        button,
        a.button {
            min-height: 38px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-top: 18px;
            padding: 0 14px;
            border: 1px solid var(--accent);
            border-radius: 8px;
            background: var(--accent);
            color: white;
            font: inherit;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
        }

        code {
            display: block;
            margin-top: 14px;
            padding: 12px;
            border: 1px solid var(--line);
            border-radius: 8px;
            overflow-wrap: anywhere;
            color: #dbeafe;
            background: #0f172a;
        }
    </style>
</head>
<body>
<main>
    <h1 id="title">NyankoBot OAuth</h1>
    <p id="message">Preparing login handoff...</p>
    <div id="action"></div>
</main>

<script>
    const title = document.getElementById('title');
    const message = document.getElementById('message');
    const action = document.getElementById('action');
    const params = new URLSearchParams(window.location.search);

    function setStatus(nextTitle, nextMessage) {
        title.textContent = nextTitle;
        message.textContent = nextMessage;
    }

    function storageKey(state) {
        return `nyankobot-oauth-return:${state || 'default'}`;
    }

    function rememberReturnTarget() {
        const authorizeUrl = params.get('authorize_url');
        const returnTo = params.get('return_to');
        const state = params.get('state');
        if (!authorizeUrl || !returnTo || !state) {
            return false;
        }

        sessionStorage.setItem(storageKey(state), JSON.stringify({
            returnTo,
            createdAt: Date.now()
        }));
        setStatus('Opening login', 'Sending you to the selected platform. You will return here briefly after login.');
        window.location.replace(authorizeUrl);
        return true;
    }

    function readReturnTarget(state) {
        const raw = sessionStorage.getItem(storageKey(state));
        if (!raw) {
            return null;
        }

        try {
            const parsed = JSON.parse(raw);
            if (!parsed || !parsed.returnTo) {
                return null;
            }

            return parsed.returnTo;
        } catch {
            return null;
        }
    }

    function forwardCallback() {
        const state = params.get('state');
        const hasCallback = params.has('code') || params.has('error');
        if (!hasCallback) {
            return false;
        }

        const returnTo = readReturnTarget(state);
        if (!returnTo) {
            setStatus('Return target missing', 'This browser tab no longer knows which local NyankoBot instance started the login.');
            const code = document.createElement('code');
            code.textContent = window.location.href;
            action.appendChild(code);
            return true;
        }

        sessionStorage.removeItem(storageKey(state));
        const target = new URL(returnTo);
        for (const [key, value] of params.entries()) {
            target.searchParams.set(key, value);
        }

        setStatus('Returning to NyankoBot', 'Sending the login result back to your local NyankoBot instance.');
        window.location.replace(target.toString());
        return true;
    }

    if (!rememberReturnTarget() && !forwardCallback()) {
        setStatus('NyankoBot OAuth handoff', 'Open this page through NyankoBot when connecting a Twitch or Kick account.');
    }
</script>
</body>
</html>
